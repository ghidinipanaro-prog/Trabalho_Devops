name: Pipeline DEV

on:
  push:
    branches: [develop]

env:
  IMAGE: ghcr.io/ghidinipanaro-prog/devoops

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:dev-${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy no namespace dev
        shell: powershell
        run: |
          $f = "k8s/overlays/dev/kustomization.yaml"
          (Get-Content $f) -replace 'newTag:.*', 'newTag: dev-${{ github.sha }}' | Set-Content $f
          kubectl apply -k k8s/overlays/dev
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl rollout status deployment/devoops -n dev --timeout=120s
          if ($LASTEXITCODE -ne 0) { exit 1 }
