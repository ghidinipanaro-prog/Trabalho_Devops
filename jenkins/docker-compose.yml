services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-devops
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kind

networks:
  kind:
    external: true
    name: kind

volumes:
  jenkins_home:
